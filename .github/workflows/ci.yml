name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each PR merged with the ones ahead of it; its required checks come from this run.
  merge_group:
  # Nightly on main: pester-varied-setup only (#655), whatever changed; every other job skips.
  schedule:
    # 03:41 UTC. Off the hour: GitHub delays, and may drop, scheduled runs at the start of each hour.
    - cron: "41 3 * * *"

permissions:
  contents: read

jobs:
  repo-rules:
    if: github.event_name != 'schedule' # the nightly run is pester-varied-setup's alone
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PII_PATTERNS lives in the main-push environment, which only main may use (#309), so no branch's run can read it.
    # Every other run uses no environment.
    environment: >-
      ${{ github.repository == 'Sour-Dev-Home/metaphor-accessibility' && github.event_name == 'push'
      && github.ref == 'refs/heads/main' && 'main-push' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the commit-message step needs the PR's commits, not just the merge result
      # Dependabot's commit bodies carry release notes past the body limit; its PRs get the maintainer's message on
      # the squash merge. Review trailers: docs/contributors/reference/security-review.md (fetch-depth 0 brings
      # origin/main, which the clean-merge rule compares with).
      # This step stays first: a step running the PR's code could write $GITHUB_ENV or $GITHUB_PATH (BASH_ENV, a fake
      # git or gh) and so control every step after it.
      - name: Check the pull request's commit messages and review trailers
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # A skip trailer counts only on the maintainer's PR (#309); the read-only token reads the author's repository
          # permission through `gh api`. The security-reviewed label is review-gate.yml's, from main's copy (#330).
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        # A PR not by the maintainer is judged by the base branch's copy of the gate, so it can't edit the check that
        # judges it. The maintainer's PR (OWNER, or an admin: in an organization the maintainer shows as MEMBER) runs
        # its own copy, so changes to the gate test themselves.
        run: |
          set -o pipefail # so a failed git ls-tree below stops the step
          gate="$RUNNER_TEMP/base-scripts"
          if [ "$PR_AUTHOR_ASSOCIATION" = OWNER ]; then
            gate=scripts
          else
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR/permission" --jq .permission)" ||
              exit 1
            [ "$permission" != admin ] || gate=scripts
          fi
          if [ "$gate" != scripts ]; then
            mkdir -p "$gate/check" "$gate/ci"
            # check.sh's modules (ADR 0013) as the base branch has them.
            modules="$(git ls-tree --name-only "$BASE" scripts/check/ | sed 's|^scripts/||')" || exit 1
            for script in check.sh ci/security-stamp.sh $modules; do
              git show "$BASE:scripts/$script" > "$gate/$script" || exit 1
            done
          fi
          bash "$gate/check.sh" commits "$BASE..$HEAD"
      - name: Install the docs tools
        run: bash scripts/setup/install-docs-tools.sh
      - name: Test the check scripts
        run: bash scripts/check/run-check-suites.sh
      - name: Check every tracked file
        env:
          # The private list reaches pushes to this repository's main only, never a pull request, so a fork's code
          # can't read it, and a fork's own main isn't required to have it. It's a secret of the main-push
          # environment, so a branch run that edits this expression still can't read it.
          PII_PATTERNS: >-
            ${{ github.repository == 'Sour-Dev-Home/metaphor-accessibility' && github.event_name == 'push'
            && github.ref == 'refs/heads/main' && secrets.PII_PATTERNS || '' }}
          REQUIRE_PRIVATE_PATTERNS: >-
            ${{ github.repository == 'Sour-Dev-Home/metaphor-accessibility' && github.event_name == 'push'
            && github.ref == 'refs/heads/main' && '1' || '' }}
        run: bash scripts/check.sh rules
      - name: Check the docs
        env:
          REQUIRE_DOCS_TOOLS: "1"
        run: bash scripts/check.sh docs
      # The description reaches the script through a file, never through the shell's command line.
      - name: Check the pull request's description
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          REQUIRE_DOCS_TOOLS: "1"
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          bash scripts/check.sh pr-body "$RUNNER_TEMP/pr-body.md"

  # Two paths under one check name (#100). On a pull request: the .NET work on Linux, which is fast, skipped when only
  # docs changed. In the merge queue and on main: the full Windows gate, where the release package is built and rebuilt;
  # players' builds stay Windows-built until the same bytes from both systems are shown.
  build:
    if: github.event_name != 'schedule'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the change check diffs the PR against its base
      # A skipped job still reports success, so the required check never goes missing. Merge-queue and main runs skip nothing.
      - name: Check what changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/what-runs.sh --job code "$BASE" "$HEAD"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # Private patterns run in repo-rules only, so the secret reaches one job; this job warns that they're missing.
      # The Pester script tests run in the parallel `scripts` job.
      - name: Check, build, test and verify formatting
        if: steps.changes.outputs.run == 'true'
        env:
          SKIP_SCRIPT_TESTS: "1"
        run: bash scripts/check.sh full
      # The players' download (#308), by the recipe releases use too (scripts/release/build-release.sh): package the Release
      # build the step above built and tested, check it names this commit as clean, zip it reproducibly with its
      # SHA256SUMS, then rebuild in a second checkout and compare. The attest job signs the zip on main.
      # Publishing fetches the pinned prism.dll (ADR 0005, scripts/dev/fetch-prism.ps1); both checkouts share one download.
      - name: Package, zip, rebuild and compare
        if: github.event_name != 'pull_request'
        env:
          PRISM_CACHE: ${{ runner.temp }}/prism-cache
        run: bash scripts/release/build-release.sh --no-build "metaphor-accessibility-$GITHUB_SHA" artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: mod-${{ github.sha }}
          path: artifacts/mod
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: error

  # The release dry run (#308): signs the zip the build job made on main with a build-provenance attestation, then
  # checks it with the command players run (docs/players/how-to/check-a-download.md). It runs none of our code, so the
  # signing token never meets the build; no other job asks for id-token or attestations.
  attest:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # a Sigstore signing certificate for this workflow
      attestations: write # store the attestation with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Check the zip against SHA256SUMS
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/metaphor-accessibility-${{ github.sha }}.zip
      - name: Verify it as a player would
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="release/metaphor-accessibility-$GITHUB_SHA.zip"
          gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --deny-self-hosted-runners

  # The scripts' Pester tests, in parallel with build. They need Windows (PowerShell scripts against
  # the stand-in game) and run when a change touches scripts, tests/pester, the stand-in game or the workflows. One job
  # per test file (#314: the files ran one after another in a single job, over 5 of its 6 minutes); each job builds the
  # stand-in game on its own runner, so the files can't collide on its obj folder.
  pester:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        file: [check-install, fetch-prism, GameLocator, ghidra, install, install-pester, onboard, scrub, session, session-inspect, session-smoke, setup-wsl, zip-package]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check what changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/what-runs.sh --job scripts "$BASE" "$HEAD"
      # No package cache: most test files restore no packages, so on a cache miss the save step finds no folder and
      # fails the job (as in the security job).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          global-json-file: global.json
      # The pinned Pester, not whichever the runner image ships, installed and its signer checked as onboarding does
      # (#456, #477); pester-varied-setup runs the same script.
      - name: Install the pinned Pester
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/ci/install-pester.sh
      - name: Run the Pester tests
        if: steps.changes.outputs.run == 'true'
        env:
          TEST_FILE: tests/pester/${{ matrix.file }}.Tests.ps1
        # Any Pester 5 or later runs; one other than the pin only warns, as in run-pester.sh.
        run: |
          pwsh -NoProfile -Command '$m = Import-Module Pester -MinimumVersion 5.0 -PassThru; if ("$($m.Version)" -ne $env:PESTER_PIN) { "::warning::Pester $($m.Version) loaded, not the pinned $env:PESTER_PIN" }; $r = Invoke-Pester $env:TEST_FILE -PassThru -Output Normal; exit $r.FailedCount'

  # Every Pester file once more, on a setup unlike the runner's default (#459): a German culture, a checkout whose path
  # holds a space, é and Japanese, and a temporary folder whose path holds a space and é, as a player's or
  # contributor's may. The tests that start Windows PowerShell 5.1 run it under the same culture and folders. Merge
  # queue and main only, beside the Windows build (ADR 0008), so pull requests stay fast, and there only when the
  # installer, the setup scripts, the Pester tests or their runners change (scripts/ci/what-runs.sh --job varied-setup,
  # #655); nightly on main it runs whatever changed. When it runs, the required `scripts` check needs it to pass. One
  # job, not a second matrix: run-pester.sh runs the files in parallel on the runner's cores, as `check.sh full` does.
  pester-varied-setup:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: Bibliothèque Steam/日本 repo
    env:
      CULTURE: de-DE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: Bibliothèque Steam/日本 repo
          fetch-depth: 0 # the change check diffs the queue's merge (or the push) against its base
      # A step-level skip: the job still finishes green, and `scripts` reads that as passed. The diff that can't be read
      # runs everything, so a skip only ever means nothing it tests changed.
      - name: Check what changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.merge_group.head_sha || github.event.after }}
        run: bash scripts/ci/what-runs.sh --job varied-setup "$BASE" "$HEAD"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          global-json-file: Bibliothèque Steam/日本 repo/global.json
      - name: Install the pinned Pester
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/ci/install-pester.sh
      # The user's culture, which every process started after this reads: pwsh, Windows PowerShell 5.1 (the player
      # scripts' tests start it) and .NET. Set-Culture alone, in its own process: with Set-WinUILanguageOverride after it
      # in the same process, new processes still started in en-US (#459, merge-queue run 44649956650; a probe with
      # Set-Culture alone, run 44652941749, gave de-DE). The UI language needs a language pack the image lacks, so
      # error messages stay English.
      - name: Switch the user's culture
        if: steps.changes.outputs.run == 'true'
        run: |
          pwsh -NoProfile -Command 'Set-Culture $env:CULTURE -ErrorAction Stop'
          for shell in pwsh powershell; do
            culture="$("$shell" -NoProfile -Command '(Get-Culture).Name' | tr -d '\r')"
            echo "$shell culture: $culture, UI culture: $("$shell" -NoProfile -Command '(Get-UICulture).Name' | tr -d '\r')"
            [ "$culture" = "$CULTURE" ] || { echo "::error::$shell runs in $culture, not $CULTURE"; exit 1; }
          done
      # Not Japanese in the temporary folder: the tests read their child processes' output and their batch stand-ins'
      # files through the console's code page, which can't hold it. check-install.Tests.ps1 and ghidra.Tests.ps1 test
      # the scripts with such paths directly.
      - name: Run every Pester file
        if: steps.changes.outputs.run == 'true'
        run: |
          temp="$RUNNER_TEMP/Temp é"
          mkdir -p "$temp"
          export TMPDIR="$temp" TEMP="$(cygpath -w "$temp")" TMP="$(cygpath -w "$temp")"
          bash scripts/check/run-pester.sh

  # The required check named `scripts` (the ruleset asks for it by name): it passes when every Pester job passed, or was
  # skipped on the one event its `if` skips it on, and fails otherwise: failed, cancelled, or skipped where it should
  # have run (#655). GitHub counts a skipped job's check as passed, so the result is read here, not trusted. Add a test
  # file under tests/pester and to the matrix above; tests/bash/test-ci-matrix.sh fails when the two disagree.
  scripts:
    needs: [pester, pester-varied-setup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every Pester job passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULT: ${{ needs.pester.result }}
          VARIED: ${{ needs.pester-varied-setup.result }}
        run: |
          echo "pester jobs: $RESULT; varied setup: $VARIED ($EVENT_NAME)"
          [ "$RESULT" = success ] || { [ "$RESULT" = skipped ] && [ "$EVENT_NAME" = schedule ]; } || exit 1
          [ "$VARIED" = success ] || { [ "$VARIED" = skipped ] && [ "$EVENT_NAME" = pull_request ]; } || exit 1

  # Runs beside build, so it gates merges without slowing the commit stage. A vulnerable package fails the job; a new
  # high or critical CodeQL security alert blocks the merge through the ruleset's code-scanning rule. It runs on every
  # pull request: code scanning must report on each one.
  security:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload CodeQL results to code scanning
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No package cache: this job restores no packages, so on a cache miss the save step finds no folder and fails.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # The C# code and the workflows themselves. build-mode none reads the source without building it.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp, actions
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      # From the committed lock files only, with a pinned scanner: no restore, so no project a PR adds can change the
      # result (#324). The build job's locked-mode restore keeps the lock files true to the projects.
      - name: Fail on vulnerable packages, transitive ones included
        run: |
          bash scripts/ci/vuln-audit.sh install "$RUNNER_TEMP/osv"
          bash scripts/ci/vuln-audit.sh scan "$RUNNER_TEMP/osv/osv-scanner"

  # Stage 2's time against its 5-minute budget (issue #1): each job's duration on the run's summary page, and a warning
  # annotation when the stage runs over. It only reports, so it runs after the others whatever their result.
  timing:
    needs: [repo-rules, build, pester, pester-varied-setup, scripts, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read # read this run's job times
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/check/stage-timing.sh
          sparse-checkout-cone-mode: false
      - name: Time stage 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.status == "completed" and .conclusion != "skipped")
              | [.name, .started_at, .completed_at] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          bash scripts/check/stage-timing.sh jobs "stage 2 (CI)" 300 "$RUNNER_TEMP/jobs.tsv"
